[workspace]
members = [
    "crates/cipherfs-core",
    "crates/cipherfs-fuse",
    "crates/cipherfs-winfsp",
    "crates/cipherfs-update",
    "apps/cipherfs-cli",
    "apps/cipherfs-windows-shell",
]
default-members = [
    "crates/cipherfs-core",
    "crates/cipherfs-update",
    "apps/cipherfs-cli",
]
resolver = "3"

[workspace.package]
version = "3.2.2"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.103"
argon2 = "0.5.3"
blake3 = "1.8.5"
cap-std = "4.0.2"
chacha20poly1305 = "0.10.1"
clap = { version = "4.6.1", features = ["derive"] }
ctrlc = "3.5.1"
hex = "0.4.3"
hkdf = "0.13.0"
indicatif = "0.18.4"
libc = "0.2.186"
minisign-verify = "0.2.5"
parking_lot = "0.12.5"
rand = "0.10.1"
raw-window-handle = "0.6.2"
rayon = "1.11.0"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rmp-serde = "1.3.1"
rpassword = "7.5.2"
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde-big-array = "0.5.1"
self-replace = "1.5.0"
sha2 = "0.10.9"
slint = { version = "=1.17.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "accessibility", "compat-1-2", "raw-window-handle-06"] }
tempfile = "3.27.0"
walkdir = "2.5.0"
zeroize = { version = "1.8.2", features = ["derive"] }

[patch.crates-io]
winfsp-sys = { path = "vendor/winfsp-sys" }
