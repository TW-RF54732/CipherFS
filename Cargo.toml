[package]
name = "cipherfs"
version = "2.1.0-beta.1"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
argon2 = "0.5.3"
blake3 = "1.8.5"
chacha20poly1305 = "0.10.1"
clap = { version = "4.6.1", features = ["derive"] }
fuser = { version = "0.17.0", default-features = false }
hkdf = "0.12.4"
hex = "0.4.3"
indicatif = "0.18.4"
libc = "0.2.186"
minisign-verify = "0.2.5"
parking_lot = "0.12.5"
rand = "0.10.1"
rayon = "1.11.0"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rmp-serde = "1.3.1"
rpassword = "7.5.2"
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde-big-array = "0.5.1"
sha2 = "0.10.9"
self-replace = "1.5.0"
walkdir = "2.5.0"
zeroize = { version = "1.8.2", features = ["derive"] }

[dev-dependencies]
tempfile = "3.27.0"
