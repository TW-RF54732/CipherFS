name: CI

on:
  push:
    branches: ["main"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "apps/**"
      - "assets/**"
      - "crates/**"
      - "vendor/**"
      - "tests/**"
      - "scripts/**"
      - "installer/**"
      - ".github/workflows/**"
  pull_request:
    branches: ["main"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "apps/**"
      - "assets/**"
      - "crates/**"
      - "vendor/**"
      - "tests/**"
      - "scripts/**"
      - "installer/**"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse3-dev

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Formatting, Clippy, unit tests, and dependency boundaries
        run: |
          cargo fmt --check
          cargo clippy --locked -p cipherfs-core -p cipherfs-update -p cipherfs-cli -p cipherfs-fuse --all-targets -- -D warnings
          cargo test --locked -p cipherfs-core -p cipherfs-update -p cipherfs-cli -p cipherfs-fuse
          if cargo tree --locked -p cipherfs-core | grep -E 'clap|rpassword|indicatif|reqwest|self-replace|fuser|winfsp'; then
            echo 'cipherfs-core contains a forbidden frontend, network, mount, or UI dependency' >&2
            exit 1
          fi
