name: CI/CD

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CIPHERFS_MINISIGN_PUBLIC_KEY: ${{ vars.CIPHERFS_MINISIGN_PUBLIC_KEY }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3 libfuse3-dev expect musl-tools
          rustup target add x86_64-unknown-linux-musl

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Static checks
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Build static release
        run: cargo build --locked --release --target x86_64-unknown-linux-musl

      - name: Pack, verify, extract, and mount E2E
        run: |
          mkdir -p test_source/empty test_extract test_mount
          printf 'secret data\n' > test_source/secret.txt
          head -c 4194305 /dev/urandom > test_source/boundary.bin

          cat > test_pack.exp <<'EOF'
          spawn ./target/x86_64-unknown-linux-musl/release/cipherfs pack test_source test.cfs --m-cost 8192 --t-cost 1 --p-cost 1
          expect "Set Master Password:"
          send "pass123\r"
          expect "Verify Master Password:"
          send "pass123\r"
          expect "Set Duress Password (optional):"
          send "duress123\r"
          expect eof
          EOF
          expect test_pack.exp

          cat > test_verify.exp <<'EOF'
          spawn ./target/x86_64-unknown-linux-musl/release/cipherfs verify test.cfs
          expect "Enter Password:"
          send "pass123\r"
          expect eof
          EOF
          expect test_verify.exp

          cat > test_extract.exp <<'EOF'
          spawn ./target/x86_64-unknown-linux-musl/release/cipherfs extract test.cfs test_extract
          expect "Enter Password:"
          send "pass123\r"
          expect eof
          EOF
          expect test_extract.exp
          diff -r test_source test_extract

          cat > test_mount.exp <<'EOF'
          spawn ./target/x86_64-unknown-linux-musl/release/cipherfs mount test.cfs test_mount --cache-mib 64
          expect "Enter Password:"
          send "pass123\r"
          expect "CipherFS is mounted read-only."
          sleep 1
          if {[catch {system "diff -r test_source test_mount"} result]} {
              puts "Mount diff failed: $result"
              exit 1
          }
          send "\003"
          expect eof
          EOF
          expect test_mount.exp

          cp test.cfs corrupt.cfs
          python3 - <<'PY'
          path = "corrupt.cfs"
          with open(path, "r+b") as handle:
              handle.seek(-1, 2)
              value = handle.read(1)
              handle.seek(-1, 2)
              handle.write(bytes([value[0] ^ 1]))
          PY

          mkdir -p corrupt_extract corrupt_mount
          cat > corrupt_extract.exp <<'EOF'
          spawn ./target/x86_64-unknown-linux-musl/release/cipherfs extract corrupt.cfs corrupt_extract
          expect "Enter Password:"
          send "pass123\r"
          expect eof
          EOF
          expect corrupt_extract.exp
          test ! -e corrupt_extract/boundary.bin
          test ! -e corrupt_extract/secret.txt

          cat > corrupt_mount.exp <<'EOF'
          spawn ./target/x86_64-unknown-linux-musl/release/cipherfs mount corrupt.cfs corrupt_mount --cache-mib 0
          expect "Enter Password:"
          send "pass123\r"
          expect "CipherFS is mounted read-only."
          sleep 1
          if {[catch {system "cat corrupt_mount/boundary.bin >/dev/null 2>&1"} result]} {
              puts "Untampered file could not be read: $result"
              exit 1
          }
          if {![catch {system "cat corrupt_mount/secret.txt >/dev/null 2>&1"} result]} {
              puts "Corrupted chunk unexpectedly returned plaintext"
              exit 1
          }
          send "\003"
          expect eof
          EOF
          expect corrupt_mount.exp

      - name: Upload tested release binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cipherfs-linux-amd64
          path: target/x86_64-unknown-linux-musl/release/cipherfs
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download tested binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cipherfs-linux-amd64
          path: release

      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          test "v${cargo_version}" = "${GITHUB_REF_NAME}"

      - name: Build signed release manifest
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.CIPHERFS_MINISIGN_SECRET_KEY }}
        shell: bash
        run: |
          test -n "${MINISIGN_SECRET_KEY}"
          sudo apt-get update
          sudo apt-get install -y minisign
          chmod +x release/cipherfs
          size="$(stat -c '%s' release/cipherfs)"
          digest="$(sha256sum release/cipherfs | cut -d' ' -f1)"
          version="${GITHUB_REF_NAME#v}"
          printf 'version=%s\ntarget=x86_64-unknown-linux-musl\nasset=cipherfs\nsize=%s\nsha256=%s\n' \
            "${version}" "${size}" "${digest}" > release/cipherfs-linux-amd64.manifest
          printf '%s' "${MINISIGN_SECRET_KEY}" > release/minisign.key
          chmod 600 release/minisign.key
          minisign -S -W -s release/minisign.key -m release/cipherfs-linux-amd64.manifest
          rm -f release/minisign.key
          tar -C release -czf release/cipherfs-linux-amd64.tar.gz cipherfs

      - name: Attest release artifacts
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: |
            release/cipherfs
            release/cipherfs-linux-amd64.tar.gz
            release/cipherfs-linux-amd64.manifest

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: release_notes/${{ github.ref_name }}_release.md
          files: |
            release/cipherfs
            release/cipherfs-linux-amd64.tar.gz
            release/cipherfs-linux-amd64.manifest
            release/cipherfs-linux-amd64.manifest.minisig
