name: CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse3-dev fuse3 expect

      - name: Cache Cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Release
        run: cargo build --release

      - name: Run E2E Tests
        run: |
          echo "=== 1. Pack ==="
          mkdir -p test_source
          echo "secret data" > test_source/secret.txt
          echo "more data" > test_source/more.txt
          
          cat << 'EOF' > test_pack.exp
          spawn ./target/release/cipherfs pack test_source test.cfs
          expect "Set Master Password:"
          send "pass123\r"
          expect "Verify Master Password:"
          send "pass123\r"
          expect "Set Duress Password (Optional, Enter to skip):"
          send "duress123\r"
          expect eof
          EOF
          expect test_pack.exp
          
          echo "=== 2. Extract ==="
          mkdir -p test_extract
          cat << 'EOF' > test_extract.exp
          spawn ./target/release/cipherfs extract test.cfs test_extract
          expect "Enter Password:"
          send "pass123\r"
          expect eof
          EOF
          expect test_extract.exp
          
          diff -r test_source test_extract
          echo "Extract test passed!"
          
          echo "=== 3. Mount ==="
          mkdir -p test_mount
          cat << 'EOF' > test_mount.exp
          spawn ./target/release/cipherfs mount test.cfs test_mount
          expect "Enter Password:"
          send "pass123\r"
          expect "CipherFS is mounted and ready."
          
          # Use sleep briefly to ensure FUSE handles the VFS correctly
          sleep 1
          
          if {[catch {system "diff -r test_source test_mount"} result]} {
              puts "Diff failed: $result"
              exit 1
          }
          
          # Send SIGINT to unmount gracefully
          send "\003"
          expect eof
          EOF
          expect test_mount.exp
          echo "Mount test passed!"
          
          echo "=== 4. Passwd ==="
          cat << 'EOF' > test_passwd.exp
          spawn ./target/release/cipherfs passwd test.cfs
          expect "Enter Current Password:"
          send "pass123\r"
          expect "Set New Master Password:"
          send "newpass123\r"
          expect "Verify New Master Password:"
          send "newpass123\r"
          expect eof
          EOF
          expect test_passwd.exp
          
          rm -rf test_extract/*
          cat << 'EOF' > test_extract_new.exp
          spawn ./target/release/cipherfs extract test.cfs test_extract
          expect "Enter Password:"
          send "newpass123\r"
          expect eof
          EOF
          expect test_extract_new.exp
          diff -r test_source test_extract
          echo "Passwd test passed!"
          
          echo "=== 5. Duress Wipe ==="
          cat << 'EOF' > test_duress.exp
          spawn ./target/release/cipherfs extract test.cfs test_extract
          expect "Enter Password:"
          send "duress123\r"
          expect "Vault neutralized"
          expect eof
          EOF
          expect test_duress.exp
          
          cat << 'EOF' > test_fail.exp
          spawn ./target/release/cipherfs extract test.cfs test_extract
          expect "Enter Password:"
          send "newpass123\r"
          expect eof
          catch wait result
          set exit_status [lindex $result 3]
          if {$exit_status == 0} {
              puts "Error: Expected extraction to fail but it succeeded!"
              exit 1
          } else {
              puts "Verification: Correctly failed to extract wiped vault."
              exit 0
          }
          EOF
          expect test_fail.exp
          echo "Duress wipe test passed!"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cipherfs-linux-amd64
          path: target/release/cipherfs
