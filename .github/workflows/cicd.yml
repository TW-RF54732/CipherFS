name: CI/CD

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CIPHERFS_MINISIGN_PUBLIC_KEY: ${{ vars.CIPHERFS_MINISIGN_PUBLIC_KEY }}

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned dependency policy tools
        run: |
          cargo install --locked cargo-audit --version 0.22.2
          cargo install --locked cargo-deny --version 0.20.2
      - name: Reject vulnerabilities and unapproved dependencies
        run: |
          cargo audit --ignore RUSTSEC-2024-0436
          cargo deny --locked check advisories licenses sources

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse3 libfuse3-dev expect musl-tools
          rustup target add x86_64-unknown-linux-musl

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Static checks
        run: |
          cargo fmt --check
          cargo check --locked --workspace --all-targets
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
          for package in cipherfs-core cipherfs-fuse cipherfs-winfsp cipherfs-update cipherfs-cli cipherfs-windows-shell; do
            cargo check --locked -p "$package"
          done
          if cargo tree --locked -p cipherfs-core | grep -E 'clap|rpassword|indicatif|reqwest|self-replace|fuser|winfsp'; then
            echo 'cipherfs-core contains a forbidden frontend, network, mount, or UI dependency' >&2
            exit 1
          fi

      - name: Build static release
        run: cargo build --locked --release --target x86_64-unknown-linux-musl

      - name: Pack, verify, extract, and mount E2E
        run: |
          case_dir="$RUNNER_TEMP/cipherfs-linux-e2e"
          mkdir -p "$case_dir/source/empty" "$case_dir/mount" "$case_dir/corrupt-mount"
          printf 'secret data\n' > "$case_dir/source/secret.txt"
          head -c 4194321 /dev/urandom > "$case_dir/source/boundary.bin"
          expect tests/linux_e2e.exp \
            ./target/x86_64-unknown-linux-musl/release/cipherfs \
            "$case_dir"
          test -z "$(findmnt -rn -o TARGET "$case_dir/mount" || true)"
          test -z "$(findmnt -rn -o TARGET "$case_dir/corrupt-mount" || true)"

      - name: Upload tested release binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cipherfs-linux-amd64
          path: target/x86_64-unknown-linux-musl/release/cipherfs
          if-no-files-found: error

  windows-test:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Workspace checks and release build without WinFsp runtime
        run: |
          cargo fmt --check
          .\scripts\generate-third-party.ps1
          git diff --exit-code -- THIRD_PARTY_DEPENDENCIES.md
          cargo check --locked --workspace --all-targets --target x86_64-pc-windows-msvc
          cargo clippy --locked --workspace --all-targets --target x86_64-pc-windows-msvc -- -D warnings
          @('cipherfs-core', 'cipherfs-fuse', 'cipherfs-winfsp', 'cipherfs-update', 'cipherfs-cli', 'cipherfs-windows-shell') | ForEach-Object {
            cargo check --locked -p $_ --target x86_64-pc-windows-msvc
            if ($LASTEXITCODE -ne 0) { throw "Independent crate check failed: $_" }
          }
          $coreTree = cargo tree --locked -p cipherfs-core --target x86_64-pc-windows-msvc
          if (($coreTree -join "`n") -match 'clap|rpassword|indicatif|reqwest|self-replace|fuser|winfsp') {
            throw 'cipherfs-core contains a forbidden frontend, network, mount, or UI dependency'
          }
          cargo test --locked --workspace --exclude cipherfs-winfsp --target x86_64-pc-windows-msvc -- --test-threads=1
          cargo build --locked --release --target x86_64-pc-windows-msvc -p cipherfs-cli -p cipherfs-windows-shell
          .\target\x86_64-pc-windows-msvc\release\cipherfs.exe --help
          .\target\x86_64-pc-windows-msvc\release\cipherfs.exe --version
          .\target\x86_64-pc-windows-msvc\release\cipherfs.exe licenses | Select-String 'GNU GENERAL PUBLIC LICENSE'
          .\target\x86_64-pc-windows-msvc\release\cipherfs-shell.exe --headless-smoke
          .\target\x86_64-pc-windows-msvc\release\cipherfs-shell.exe --winfsp-runtime-missing-smoke
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe |
            Where-Object { $_.FullName -match 'Hostx64\\x64' } |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe not found' }
          $imports = & $dumpbin.FullName /imports .\target\x86_64-pc-windows-msvc\release\cipherfs.exe
          if (($imports -join "`n") -notmatch 'winfsp-x64.dll') {
            throw 'CLI WinFsp delay-load import is missing'
          }
          $shellImports = & $dumpbin.FullName /imports .\target\x86_64-pc-windows-msvc\release\cipherfs-shell.exe
          if (($shellImports -join "`n") -notmatch 'winfsp-x64.dll') {
            throw 'Shell WinFsp delay-load import is missing'
          }

      - name: Install pinned WinFsp runtime and development files
        shell: pwsh
        run: |
          $url = 'https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi'
          Invoke-WebRequest -Uri $url -OutFile winfsp.msi
          $actual = (Get-FileHash winfsp.msi -Algorithm SHA256).Hash
          if ($actual -ne '073A70E00F77423E34BED98B86E600DEF93393BA5822204FAC57A29324DB9F7A') {
            throw "WinFsp MSI hash mismatch: $actual"
          }
          $process = Start-Process msiexec.exe -Wait -PassThru -ArgumentList '/i', (Resolve-Path winfsp.msi), '/qn', '/norestart', 'ADDLOCAL=ALL'
          if ($process.ExitCode -notin 0, 3010) { throw "WinFsp install failed: $($process.ExitCode)" }

      - name: WinFsp runtime E2E
        run: |
          $env:PATH = "${env:ProgramFiles(x86)}\WinFsp\bin;$env:PATH"
          $env:CIPHERFS_WINFSP_E2E = '1'
          $env:CIPHERFS_WINFSP_FOLDER_E2E = '1'
          cargo test --locked --release -p cipherfs-winfsp --target x86_64-pc-windows-msvc tests:: -- --test-threads=1 --nocapture
          cargo test --locked --release -p cipherfs-windows-shell --target x86_64-pc-windows-msvc worker_mount_session_auto_drive_and_unmount -- --test-threads=1 --nocapture

      - name: Upload tested Windows binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cipherfs-windows-amd64
          path: |
            target/x86_64-pc-windows-msvc/release/cipherfs.exe
            target/x86_64-pc-windows-msvc/release/cipherfs-shell.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [supply-chain, test, windows-test]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download tested binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cipherfs-linux-amd64
          path: release

      - name: Download tested Windows binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cipherfs-windows-amd64
          path: release

      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          test "v${cargo_version}" = "${GITHUB_REF_NAME}"
          chmod +x release/cipherfs
          release/cipherfs --version | grep -F "${cargo_version}"
          release/cipherfs licenses | grep -F 'GNU GENERAL PUBLIC LICENSE'

      - name: Build signed release manifest
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.CIPHERFS_MINISIGN_SECRET_KEY }}
        shell: bash
        run: |
          test -n "${MINISIGN_SECRET_KEY}"
          test -n "${CIPHERFS_MINISIGN_PUBLIC_KEY}"
          sudo apt-get update
          sudo apt-get install -y minisign
          chmod +x release/cipherfs
          size="$(stat -c '%s' release/cipherfs)"
          digest="$(sha256sum release/cipherfs | cut -d' ' -f1)"
          version="${GITHUB_REF_NAME#v}"
          printf 'version=%s\ntarget=x86_64-unknown-linux-musl\nasset=cipherfs\nsize=%s\nsha256=%s\n' \
            "${version}" "${size}" "${digest}" > release/cipherfs-linux-amd64.manifest
          windows_size="$(stat -c '%s' release/cipherfs.exe)"
          windows_digest="$(sha256sum release/cipherfs.exe | cut -d' ' -f1)"
          printf 'version=%s\ntarget=x86_64-pc-windows-msvc\nasset=cipherfs.exe\nsize=%s\nsha256=%s\n' \
            "${version}" "${windows_size}" "${windows_digest}" > release/cipherfs-windows-amd64.manifest
          shell_size="$(stat -c '%s' release/cipherfs-shell.exe)"
          shell_digest="$(sha256sum release/cipherfs-shell.exe | cut -d' ' -f1)"
          printf 'version=%s\ntarget=x86_64-pc-windows-msvc\ncli_asset=cipherfs.exe\ncli_size=%s\ncli_sha256=%s\nshell_asset=cipherfs-shell.exe\nshell_size=%s\nshell_sha256=%s\n' \
            "${version}" "${windows_size}" "${windows_digest}" "${shell_size}" "${shell_digest}" > release/cipherfs-windows-integration.manifest
          printf '%s' "${MINISIGN_SECRET_KEY}" > release/minisign.key
          chmod 600 release/minisign.key
          trap 'rm -f release/minisign.key' EXIT
          minisign -S -W -s release/minisign.key -m release/cipherfs-linux-amd64.manifest
          minisign -S -W -s release/minisign.key -m release/cipherfs-windows-amd64.manifest
          minisign -S -W -s release/minisign.key -m release/cipherfs-windows-integration.manifest
          minisign -Vm release/cipherfs-linux-amd64.manifest \
            -x release/cipherfs-linux-amd64.manifest.minisig \
            -P "${CIPHERFS_MINISIGN_PUBLIC_KEY}"
          minisign -Vm release/cipherfs-windows-amd64.manifest \
            -x release/cipherfs-windows-amd64.manifest.minisig \
            -P "${CIPHERFS_MINISIGN_PUBLIC_KEY}"
          minisign -Vm release/cipherfs-windows-integration.manifest \
            -x release/cipherfs-windows-integration.manifest.minisig \
            -P "${CIPHERFS_MINISIGN_PUBLIC_KEY}"
          cp LICENSE LICENSE-GPL-3.0 THIRD_PARTY_NOTICES.md THIRD_PARTY_DEPENDENCIES.md VENDORED_WINFSP.md release/
          git archive --format=tar.gz --prefix="cipherfs-${version}/" -o "release/cipherfs-${version}-source.tar.gz" HEAD
          tar -C release -czf release/cipherfs-linux-amd64.tar.gz cipherfs LICENSE LICENSE-GPL-3.0 THIRD_PARTY_NOTICES.md THIRD_PARTY_DEPENDENCIES.md
          (cd release && zip cipherfs-windows-amd64.zip cipherfs.exe cipherfs-shell.exe LICENSE LICENSE-GPL-3.0 THIRD_PARTY_NOTICES.md THIRD_PARTY_DEPENDENCIES.md VENDORED_WINFSP.md)
          (cd release && sha256sum cipherfs cipherfs-linux-amd64.tar.gz > cipherfs-linux-amd64.sha256)
          (cd release && sha256sum cipherfs.exe cipherfs-shell.exe cipherfs-windows-amd64.zip > cipherfs-windows-amd64.sha256)
          tar -tzf release/cipherfs-linux-amd64.tar.gz | grep -Fx LICENSE-GPL-3.0
          unzip -l release/cipherfs-windows-amd64.zip | grep -F LICENSE-GPL-3.0

      - name: Attest release artifacts
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: |
            release/cipherfs
            release/cipherfs-linux-amd64.tar.gz
            release/cipherfs-linux-amd64.manifest
            release/cipherfs-linux-amd64.sha256
            release/cipherfs.exe
            release/cipherfs-shell.exe
            release/cipherfs-windows-amd64.zip
            release/cipherfs-windows-amd64.manifest
            release/cipherfs-windows-amd64.sha256
            release/cipherfs-windows-integration.manifest
            release/cipherfs-linux-amd64.manifest.minisig
            release/cipherfs-windows-amd64.manifest.minisig
            release/cipherfs-windows-integration.manifest.minisig
            release/LICENSE
            release/LICENSE-GPL-3.0
            release/THIRD_PARTY_NOTICES.md
            release/THIRD_PARTY_DEPENDENCIES.md
            release/VENDORED_WINFSP.md
            release/cipherfs-*-source.tar.gz

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          draft: ${{ !contains(github.ref_name, '-') }}
          body_path: release_notes/${{ github.ref_name }}_release.md
          files: |
            release/cipherfs
            release/cipherfs-linux-amd64.tar.gz
            release/cipherfs-linux-amd64.manifest
            release/cipherfs-linux-amd64.manifest.minisig
            release/cipherfs-linux-amd64.sha256
            release/cipherfs.exe
            release/cipherfs-shell.exe
            release/cipherfs-windows-amd64.zip
            release/cipherfs-windows-amd64.manifest
            release/cipherfs-windows-amd64.manifest.minisig
            release/cipherfs-windows-amd64.sha256
            release/cipherfs-windows-integration.manifest
            release/cipherfs-windows-integration.manifest.minisig
            release/LICENSE
            release/LICENSE-GPL-3.0
            release/THIRD_PARTY_NOTICES.md
            release/THIRD_PARTY_DEPENDENCIES.md
            release/VENDORED_WINFSP.md
            release/cipherfs-*-source.tar.gz
