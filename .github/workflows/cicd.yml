name: CI/CD

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

# Deduplicate runs: If multiple events trigger for the same commit/PR, 
# cancel the previous ones to save resources and avoid double runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse3-dev fuse3 expect musl-tools

      - name: Add musl target
        run: rustup target add x86_64-unknown-linux-musl

      - name: Cache Cargo registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Release
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Run E2E Tests
        run: |
          echo "=== 1. Pack ==="
          mkdir -p test_source
          echo "secret data" > test_source/secret.txt
          echo "more data" > test_source/more.txt
          
          cat << 'EOF' > test_pack.exp
          spawn ./target/x86_64-unknown-linux-musl/release/cipherfs pack test_source test.cfs
          expect "Set Master Password:"
          send "pass123\r"
          expect "Verify Master Password:"
          send "pass123\r"
          expect "Set Duress Password (Optional, Enter to skip):"
          send "duress123\r"
          expect eof
          EOF
          expect test_pack.exp
          
          echo "=== 2. Extract ==="
          mkdir -p test_extract
          cat << 'EOF' > test_extract.exp
          spawn ./target/x86_64-unknown-linux-musl/release/cipherfs extract test.cfs test_extract
          expect "Enter Password:"
          send "pass123\r"
          expect eof
          EOF
          expect test_extract.exp
          
          diff -r test_source test_extract
          echo "Extract test passed!"
          
          echo "=== 3. Mount ==="
          mkdir -p test_mount
          cat << 'EOF' > test_mount.exp
          spawn ./target/x86_64-unknown-linux-musl/release/cipherfs mount test.cfs test_mount
          expect "Enter Password:"
          send "pass123\r"
          expect "CipherFS is mounted and ready."
          
          sleep 1
          if {[catch {system "diff -r test_source test_mount"} result]} {
              puts "Diff failed: $result"
              exit 1
          }
          
          send "\003"
          expect eof
          EOF
          expect test_mount.exp
          echo "Mount test passed!"

      - name: Prepare Release Artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd target/x86_64-unknown-linux-musl/release
          tar -czvf cipherfs-linux-amd64.tar.gz cipherfs

      - name: Extract Release Notes
        if: startsWith(github.ref, 'refs/tags/v')
        id: release_notes
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          FILE_PATH="release_notes/${TAG_NAME}_release.md"
          if [ -f "$FILE_PATH" ]; then
            echo "notes<<EOF" >> $GITHUB_OUTPUT
            cat "$FILE_PATH" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "notes=Release $TAG_NAME" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.release_notes.outputs.notes }}
          files: |
            target/x86_64-unknown-linux-musl/release/cipherfs
            target/x86_64-unknown-linux-musl/release/cipherfs-linux-amd64.tar.gz

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cipherfs-linux-amd64
          path: target/x86_64-unknown-linux-musl/release/cipherfs
