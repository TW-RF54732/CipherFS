name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FUSE dependencies
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev pkg-config
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build CLI
        run: cargo build --release -p cipherfs-cli
      - name: Upload CLI
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: target/release/cipherfs-cli

  build-windows:
    name: Build Windows GUI (MSI)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install WinFsp (Build Dependency)
        run: |
          Invoke-WebRequest -Uri "https://github.com/winfsp/winfsp/releases/download/v2.0/winfsp-2.0.23075.msi" -OutFile "winfsp.msi"
          Start-Process -FilePath "msiexec.exe" -ArgumentList "/i winfsp.msi /qn /norestart" -Wait
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^1.5"
      - name: Build Tauri App
        run: cargo tauri build
        working-directory: ./gui
        env:
          BINDGEN_EXTRA_CLANG_ARGS: "-D_IO_STATUS_BLOCK=struct _IO_STATUS_BLOCK"
      - name: Upload MSI
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: target/release/bundle/msi/*.msi
